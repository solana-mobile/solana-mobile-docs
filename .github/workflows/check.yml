name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up
        uses: ./.github/actions/setup
      - name: Check formatting
        run: bun run format:check
      - name: Check footer disclaimers
        run: bun run check:footer
      - name: Check onchain spelling
        run: bun run check:onchain
      - name: Check code snippets
        run: bun run check:snippets
      - name: Test check scripts
        run: bun run test

  mintlify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up
        uses: ./.github/actions/setup
      - name: Check broken links
        run: bun mint broken-links --telemetry=false
      - name: Check Solana Mobile GitHub links
        run: bun run check:links
      - name: Validate documentation
        run: bun mint validate --telemetry=false
