pre-commit:
  commands:
    format:
      glob: '*.{css,js,json,jsonc,md,mdx,ts,yaml,yml}'
      run: bun run oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,ts}'
      run: bun run oxlint --deny-warnings {staged_files}

pre-push:
  commands:
    format:
      glob: '*.{css,js,json,jsonc,md,mdx,ts,yaml,yml}'
      run: bun run oxfmt --check --no-error-on-unmatched-pattern {push_files}
    lint:
      glob: '*.{js,ts}'
      run: bun run oxlint --deny-warnings {push_files}
